name: daily-nav-update

on:
  schedule:
    # 北京时间 20:30（UTC 12:30）：主更新，当日权益类基金净值已披露
    - cron: '30 12 * * *'
    # 北京时间 23:30（UTC 15:30）：补抓披露较晚的 FOF 净值（有更新才提交，无感）
    - cron: '30 15 * * *'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install deps
        run: pip install --quiet akshare pandas requests numpy

      - name: run update (数据库中枢 + 模型重训)
        run: python update_all.py

      - name: commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js fund.db
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "auto: 每日净值更新+模型重训 $(date -u +%Y-%m-%d)"
            git push
            echo "已推送，Pages 将自动重新部署"
          fi
