<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>交银基金重点产品净值表现</title>
<style>
:root{
  --brand:#0a2e6e; --brand2:#16468f; --gold:#c9a35c; --bg:#f4f6fa; --card:#ffffff;
  --up:#e0453a; --down:#1a9e54; --flat:#8a8f99; --txt:#1c2333; --sub:#6b7280; --line:#e6e9f0;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.6}
.header{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 60%,#1f5bb5 100%);color:#fff;padding:22px 16px 18px;box-shadow:0 2px 12px rgba(10,46,110,.25)}
.header h1{font-size:21px;font-weight:700;letter-spacing:1px}
.header .meta{margin-top:6px;font-size:12px;opacity:.85}
.header .meta span{margin-right:12px}
.wrap{max-width:860px;margin:0 auto;padding:14px 12px 40px}
.card{background:var(--card);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(20,40,80,.06)}
/* 首页基金卡片 */
.fund-card{display:block;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.fund-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.fund-card .fc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.fc-name{font-size:16px;font-weight:600}
.fc-code{font-size:12px;color:var(--sub);margin-left:6px;font-weight:400}
.tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px;background:#eef3fc;color:var(--brand2);margin-right:4px;white-space:nowrap}
.tag.gold{background:#faf3e3;color:#8a6d2f}
.fc-nav{margin-top:10px;display:flex;align-items:flex-end;gap:14px}
.fc-nav .nav-v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.fc-nav .nav-d{font-size:12px;color:var(--sub);padding-bottom:4px}
.fc-rets{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.ret-item{text-align:center}
.ret-item .rv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.ret-item .rl{font-size:11px;color:var(--sub)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.fc-foot{margin-top:10px;font-size:11px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
.mae-badge{background:#eef3fc;color:var(--brand2);border-radius:8px;padding:2px 8px;font-size:11px}
/* 详情页 */
.back{display:inline-block;color:var(--brand2);text-decoration:none;font-size:14px;margin-bottom:10px}
.d-title{font-size:19px;font-weight:700}
.d-sub{font-size:12px;color:var(--sub);margin-top:4px}
.d-tags{margin-top:8px}
.info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.info-cell{background:#f7f9fd;border-radius:8px;padding:8px 10px}
.info-cell .il{font-size:11px;color:var(--sub)}
.info-cell .iv{font-size:14px;font-weight:600;margin-top:2px}
.nav-main{display:flex;align-items:flex-end;gap:16px;margin-top:4px}
.nav-main .big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.nav-main .chg{font-size:16px;font-weight:600;padding-bottom:6px}
.nav-main .dt{font-size:12px;color:var(--sub);padding-bottom:7px}
.section-t{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.section-t::before{content:'';width:4px;height:14px;background:var(--gold);border-radius:2px}
.chart-box{width:100%;overflow:hidden}
/* 估值 */
.est-btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--brand),#1f5bb5);color:#fff;font-size:16px;font-weight:600;cursor:pointer;letter-spacing:2px}
.est-btn:active{opacity:.85}
.est-btn:disabled{background:#aab4c8;cursor:default}
.est-result{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.est-nav{display:flex;align-items:flex-end;gap:14px}
.est-nav .big{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.est-note{font-size:11px;color:var(--sub);margin-top:10px;line-height:1.7}
.factor-detail{margin-top:10px;font-size:12px;background:#f7f9fd;border-radius:8px;padding:10px 12px}
.factor-detail table{width:100%;border-collapse:collapse}
.factor-detail td{padding:3px 0;font-variant-numeric:tabular-nums}
.factor-detail td:last-child{text-align:right}
/* 对比表 */
.cmp-table{width:100%;border-collapse:collapse;font-size:12.5px}
.cmp-table th{background:#f0f4fb;color:var(--brand2);font-weight:600;padding:7px 4px;font-size:12px}
.cmp-table td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
/* 重仓 */
.hold-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f0f2f7}
.hold-row:last-child{border-bottom:none}
.hold-rank{width:20px;height:20px;border-radius:50%;background:#eef3fc;color:var(--brand2);font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hold-rank.top3{background:var(--brand);color:#fff}
.hold-name{flex:1;min-width:0}
.hold-name .hn{font-size:14px;font-weight:600}
.hold-name .hc{font-size:11px;color:var(--sub)}
.hold-bar-box{flex:1.2;height:8px;background:#eef1f7;border-radius:4px;overflow:hidden}
.hold-bar{height:100%;background:linear-gradient(90deg,var(--brand2),#3f7ae0);border-radius:4px}
.hold-w{width:52px;text-align:right;font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;flex-shrink:0}
/* 观点 */
.view-body{font-size:14px;line-height:1.9;color:#2a3140;white-space:pre-line}
.view-src{font-size:12px;color:var(--sub);margin-bottom:10px;padding:8px 10px;background:#f7f9fd;border-radius:8px}
/* 链接按钮 */
.link-row{display:flex;gap:10px;margin-top:12px}
.ext-link{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:10px;font-size:14px;font-weight:600}
.ext-link.primary{background:var(--brand);color:#fff}
.ext-link.ghost{border:1px solid var(--brand2);color:var(--brand2)}
.footer{font-size:11px;color:var(--sub);line-height:1.8;padding:16px 14px 30px;text-align:center}
.loading{color:var(--sub);text-align:center;padding:40px 0;font-size:14px}
.hint{font-size:12px;color:var(--sub);background:#fff8ec;border:1px solid #f3e2b8;border-radius:8px;padding:8px 10px;margin-top:10px}
</style>
</head>
<body>
<div class="header">
  <h1>交银基金重点产品净值表现</h1>
  <div class="meta"><span id="upd"></span><span>数据来源：天天基金 / 东方财富</span></div>
</div>
<div class="wrap" id="app"><div class="loading">加载中…</div></div>
<div class="footer">
  本页面数据来自公开渠道（天天基金网、东方财富、腾讯行情），仅供内部参考，不构成投资建议。<br>
  盘中估值为模型测算结果，与实际净值存在偏差，实际净值以基金公司官方披露为准。<br>
  基金有风险，投资需谨慎。
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
